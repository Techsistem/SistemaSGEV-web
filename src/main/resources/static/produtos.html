<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGEV-WEB - Catálogo de Produtos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">
                <h1>SGEV <span>WEB</span></h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="clientes.html">Clientes</a></li>
                    <li><a href="produtos.html" class="active">Produtos</a></li>
                    <li><a href="vendas.html">Nova Venda</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="card">
            <h2 class="card-title">Cadastro de Produto (Spring REST + MySQL)</h2>
            <form id="form-produto">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="prod-descricao">Descrição do Produto *</label>
                        <input type="text" id="prod-descricao" required placeholder="Ex: SSD NVMe 1TB Kingston">
                    </div>

                    <div class="form-group">
                        <label for="prod-preco">Preço Unitário (R$) *</label>
                        <input type="number" id="prod-preco" step="0.01" required placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label for="prod-estoque">Estoque Inicial *</label>
                        <input type="number" id="prod-estoque" required placeholder="0">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="reset" class="btn btn-secondary">Limpar</button>
                    <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2 class="card-title">Estoque de Produtos no Banco</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Preço Unitário</th>
                            <th>Estoque</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos-corpo">
                        <!-- Carregado dinamicamente via Spring API -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SGEV-WEB - Sistema de Gestão de Vendas. Projeto Integrador.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
